{% extends 'base.html' %} 

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Listado de Platos</h2>
        <a href="{% url 'crear_plato' %}" class="btn btn-primary">Nuevo Plato</a>
    </div>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Categoría</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for plato in platos %}
            <tr>
                <td>{{ plato.nombre }}</td>
                <td>${{ plato.precio }}</td>
                <td>{{ plato.categoria }}</td>
                <td>
                    <a href="{% url 'editar_plato' plato.id %}" class="btn btn-warning btn-sm">Editar</a>
                    <a href="{% url 'eliminar_plato' plato.id %}" class="btn btn-danger btn-sm">Eliminar</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" class="text-center">No hay platos registrados.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
