{% extends 'base.html' %} 

{% block content %}
<div class="container mt-4">
    <div class="card shadow p-4 border-danger">
        <h2 class="text-danger">Eliminar Plato</h2>
        <p class="fs-5">¿Estás seguro de que deseas eliminar el plato <strong>"{{ plato.nombre }}"</strong>?</p>

        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url 'lista_platos' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
