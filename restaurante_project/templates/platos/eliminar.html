{% extends 'base.html' %} 

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 p-4 text-center">
            <div class="card-body">
                <div class="bg-danger bg-opacity-10 text-danger rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 72px; height: 72px;">
                    <i class="bi bi-exclamation-triangle fs-2 text-danger"></i>
                </div>
                <h3 class="fw-bold text-dark mb-2">Eliminar Plato</h3>
                <p class="text-muted mb-4">
                    ¿Estás completamente seguro de que deseas eliminar el plato <strong class="text-dark">"{{ plato.nombre }}"</strong>? Esta acción no se puede deshacer.
                </p>

                <form method="POST" class="d-flex justify-content-center gap-3">
                    {% csrf_token %}
                    <a href="{% url 'lista_platos' %}" class="btn btn-light border px-4">
                        Cancelar
                    </a>
                    <button type="submit" class="btn btn-danger px-4 fw-bold shadow-sm">
                        <i class="bi bi-trash me-1"></i> Sí, eliminar
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
